PART
{
// Configurable radar part (#797): same dish as scanLockRadar1, but the ModuleConfigurableRadar
// module lets you retune range, sensitivity, scan speeds and capabilities directly in the editor PAW.

name = cfgRadarGround
module = Part
author = BahamutoD

MODEL
{
    model = BDArmory/Parts/groundRadar/radar1
}
rescaleFactor = 1

node_attach = 0.0, 0, 0, 0, -1, 0, 0

TechRequired = precisionEngineering
entryCost = 8000
cost = 4000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = #loc_BDArmory_part_cfgRadarGround_title  //Configurable Ground Radar
manufacturer = #loc_BDArmory_agent_title  //Bahamuto Dynamics
description = #loc_BDArmory_part_cfgRadarGround_description  //A ground search & track radar whose performance is tuned in the editor: detection/locking range, RCS sensitivity, scan speeds and capabilities can all be changed in this part's right-click menu without editing cfg files.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
tags = #loc_BDArmory_part_scanLockRadar1_tags
mass = 1
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 7
maxTemp = 3600

MODULE
{
        name = ModuleConfigurableRadar

        // -- Section: General Configuration --
        radarName = Configurable Ground Radar
        rwrThreatType = 0
        rotationTransformName = rotationTransform
        resourceDrain = 0.85

        // -- Section: Capabilities --
        omnidirectional = true
        directionalFieldOfView = 90
        scanRotationSpeed = 300
        showDirectionWhileScan = true
        maxLocks = 1

        canScan = true
        canLock = true
        canTrackWhileScan = true
        canReceiveRadarData = true

        radarGroundClutterFactor = 0.15
        radarChaffClutterFactor = 1.0

        radarDetectionCurve
        {
          //        key = distance	rcs
                    key = 0.0	0
                    key = 7	0	//between 0 and 7 km the min cross section is 0, thus assured detection of everything
                    key = 10 5
                    key = 20 15
                    key = 30 40	//max range 30km, but only for very large rcs
        }

        radarLockTrackCurve
        {
            //      key = distance	rcs
                    key = 0.0	0
                    key = 7	5
                    key = 10 7
                    key = 20 20
                    key = 30 50
        }
}

MODULE
{
	name = ModuleTurret

	pitchTransformName = pitchTransform
	yawTransformName = yawTransform

	pitchSpeedDPS = 120
	yawSpeedDPS = 120

	maxPitch = 85
	minPitch = -8

	yawRange = 360

	smoothRotation = true
	smoothMultiplier = 10
}

}
