PART
{
// Configurable radar part (#797): same dish as awacsRadar, but the ModuleConfigurableRadar
// module lets you retune range, sensitivity, scan speeds and capabilities directly in the editor PAW.

name = cfgRadarAwacs
module = Part
author = BahamutoD

MODEL
{
    model = BDArmory/Parts/awacsRadar/model
}
rescaleFactor = 1

node_attach = 0.0, 0, 0, 0, -1, 0, 0

TechRequired = precisionEngineering
entryCost = 25000
cost = 10000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = #loc_BDArmory_part_cfgRadarAwacs_title  //Configurable AWACS Radar
manufacturer = #loc_BDArmory_agent_title  //Bahamuto Dynamics
description = #loc_BDArmory_part_cfgRadarAwacs_description  //A large radar capable of detecting objects from a long distance, with performance tuned in the editor: detection range, RCS sensitivity, scan speeds and capabilities can all be changed in this part's right-click menu without editing cfg files. Locking is disabled by default, but can be enabled here too.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
tags = #loc_BDArmory_part_awacsRadar_tags
mass = 1.45
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 7
maxTemp = 3600

MODULE
{
	name = ModulePartVariants
	baseVariant = Legged
	useMultipleDragCubes = false
	VARIANT
	{
		name = Legged
		displayName =  #loc_BDArmory_part_AWACS_Legged
		primaryColor = #ffffff
		secondaryColor = #ffffff
		GAMEOBJECTS
		{
			colliderLeft = true
			colliderRight = true
			legs = true
			Dish = true
			DishCollider = true
			LeglessDish = false
			LeglessDishCollider = false
		}
	}
	VARIANT
	{
		name = Legless
		displayName = #loc_BDArmory_part_AWACS_Legless
		primaryColor = #ffffff
		secondaryColor = #ffffff
		GAMEOBJECTS
		{
			colliderLeft = false
			colliderRight = false
			legs = false
			Dish = false
			DishCollider = false
			LeglessDish = true
			LeglessDishCollider = true
		}
	}
}

MODULE
{
	name = ModuleConfigurableRadar

	// -- Section: General Configuration --
	radarName = Configurable AWACS Radar
	rwrThreatType = 2
	rotationTransformName = rotationTransform
	resourceDrain = 1.25

	// -- Section: Capabilities --
	omnidirectional = true
	directionalFieldOfView = 90
	scanRotationSpeed = 110
	showDirectionWhileScan = true

	canScan = true
	canLock = false
	canTrackWhileScan = false
	canReceiveRadarData = true

	radarGroundClutterFactor = 0.2

	radarDetectionCurve
	{
	  //        key = distance	rcs
            key = 0.0	0
            key = 10	0	//between 0 and 10 km the min cross section is 0, thus assured detection of everything
            key = 11	1
            key = 20	5
            key = 40	15
            key = 80	30	//max range 80km, rcs detectable is 30m^2
	}

	radarLockTrackCurve
	{
		// nothing defined here as this radar does not support locking;
		// enabling locks in the editor generates a standard lock curve from the range/RCS sliders
	}

}



}
