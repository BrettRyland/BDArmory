PART
{
// Configurable radar part (#797): same radome as bdRadome1inline, but the ModuleConfigurableRadar
// module lets you retune range, sensitivity, scan speeds and capabilities directly in the editor PAW.

name = cfgRadarAir
module = Part
author = BahamutoD
rescaleFactor = 1
node_stack_bottom01 = 0.0, -0.6598, 0.0, 0.0, -1.0, 0.0, 1
node_stack_top = 0.0, 0.6598, 0.0, 0.0, 1.0, 0.0, 1
node_attach = 0, 0, -0.625, 0.0, 0.0, 1.0
TechRequired = precisionEngineering
entryCost = 5500
cost = 2000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = size1
title = #loc_BDArmory_part_cfgRadarAir_title  //Configurable Airborne Radar
manufacturer = #loc_BDArmory_agent_title  //Bahamuto Dynamics
description = #loc_BDArmory_part_cfgRadarAir_description  //A forward facing, aerodynamically housed radar whose performance is tuned in the editor: detection/locking range, RCS sensitivity, scan speeds and capabilities can all be changed in this part's right-click menu without editing cfg files. Make sure the black markings are pointing forward.
tags = #loc_BDArmory_part_bdRadome1_tags
attachRules = 1,1,1,1,0
stackSymmetry = 2
mass = 0.375
dragModelType = default
maximum_drag = 0.1
minimum_drag = 0.1
angularDrag = .25
crashTolerance = 40
maxTemp = 2000
fuelCrossFeed = True
thermalMassModifier = 6.0
emissiveConstant = 0.95
MODEL
{
    model = BDArmory/Parts/radome125/radome1inline
    texture = tex_radome125, BDArmory/Parts/radome125/tex_radome125
}

MODULE
{
      name = ModuleConfigurableRadar

      // -- Section: General Configuration --
      radarName = Configurable Airborne Radar
      rwrThreatType = 1
      rotationTransformName = scanRotation
      resourceDrain = 0.825

      // -- Section: Capabilities --
      omnidirectional = false
      directionalFieldOfView = 120
      lockRotationAngle = 4
      showDirectionWhileScan = true
      multiLockFOV = 40
      maxLocks = 3

      canScan = true
      canLock = true
      canTrackWhileScan = true
      canReceiveRadarData = false

      radarGroundClutterFactor = 0.1

      radarDetectionCurve
      {
        //        key = distance	rcs
                  key = 0.0	0
                  key = 5	0	//between 0 and 5 km the min cross section is 0, thus assured detection of everything
                  key = 10 5
                  key = 20 15
                  key = 35 25	//maxrange of 35km
      }

      radarLockTrackCurve
      {
          //      key = distance	rcs
                  key = 0.0	0
                  key = 5	5
                  key = 10 7
                  key = 20 20
                  key = 35 35	//maxrange of 35km
      }
}



}
