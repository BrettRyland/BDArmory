            key = 11	10
            key = 20	55	//at 20km range a rcs of 55 m^2 can be detected
            key = 40	150
	}

	radarLockTrackCurve
	{		
            key = 0.0	0
            key = 3	5	//needs higher rcs to lock at comparable range
