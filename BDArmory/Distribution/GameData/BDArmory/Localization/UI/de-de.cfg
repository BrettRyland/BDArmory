                #LOC_BDArmory_AIWindow_MaxEngagementRange = #LOC_BDArmory_AI_MaxEngagementRange
                #LOC_BDArmory_AIWindow_MaxEngagementRange_Context = Maximaler Abstand, oberhalb dessen die KI nicht angreifen wird
                #LOC_BDArmory_AIWindow_ForceFiringRange = #LOC_BDArmory_AI_ForceFiringRange
                #LOC_BDArmory_AIWindow_ForceFiringRange_Context = Innerhalb dieses Abstandbereiches Feuert to KI ohne Schub
                #LOC_BDArmory_AIWindow_MaintainEngagementRange = #LOC_BDArmory_AI_MaintainEngagementRange
                #LOC_BDArmory_AIWindow_MaintainEngagementRange_Context = Das Fahrzeug stoppt / setzt zurück wenn das Ziel näher ist
                #LOC_BDArmory_AIWindow_ManeuverRCS = #LOC_BDArmory_AI_ManeuverRCS
                #LOC_BDArmory_AIWindow_ManeuverRCS_Context = RKS benutzen
                #LOC_BDArmory_AIWindow_FiringRCS = #LOC_BDArmory_AI_FiringRCS
                #LOC_BDArmory_AIWindow_FiringRCS_Context = RKS benutzen, um die Geschwindigkeit beim Feuern zu regeln
                #LOC_BDArmory_AIWindow_ReverseEngines = #LOC_BDArmory_AI_ReverseEngines
                #LOC_BDArmory_AIWindow_ReverseEngines_Context = Nach vorn zeigende Raketenmotoren zum Bremsen verwenden
                #LOC_BDArmory_AIWindow_EngineRCSRotation = #LOC_BDArmory_AI_EngineRCSRotation
                #LOC_BDArmory_AIWindow_EngineRCSRotation_Context = Raketenmotoren, die nicht auf Achse montiert sind, zur Lagesteuerung verwenden
                #LOC_BDArmory_AIWindow_EngineRCSTranslation = #LOC_BDArmory_AI_EngineRCSTranslation
                #LOC_BDArmory_AIWindow_EngineRCSTranslation_Context = Raketenmotoren, die Senkrecht auf der longitudinalen Achse stehen, für Translation verwenden
                #LOC_BDArmory_AIWindow_OrbitalPIDActive = #LOC_BDArmory_AI_OrbitalPIDActive
                #LOC_BDArmory_AIWindow_OrbitalPIDActive_Context = Konditionen für das Aktivieren des PID Reglers
                #LOC_BDArmory_AIWindow_RollMode = #LOC_BDArmory_AI_RollMode
                #LOC_BDArmory_AIWindow_RollMode_Context = Wenn PID Regler aktiv ist, soll die KI rollen, um diese Seite des Schiffes auf das Ziel zu richten
                #LOC_BDArmory_AIWindow_MinObstacleMass = #LOC_BDArmory_AI_MinObstacleMass
                #LOC_BDArmory_AIWindow_MinObstacleMass_Context = Minimale Masse, ab der ein Hindernis umfahren wird
                #LOC_BDArmory_AIWindow_PreferredBroadsideDirection = #LOC_BDArmory_AI_PreferredBroadsideDirection
                #LOC_BDArmory_AIWindow_PreferredBroadsideDirection_Context = Bevorzugte Seite, die die Kampfeinheit zum Gegner richten soll
                #LOC_BDArmory_AIWindow_ManeuverSpeed = #LOC_BDArmory_AI_ManeuverSpeed
