                #LOC_BDArmory_AIWindow_EvasionErraticness = #LOC_BDArmory_AI_EvasionErraticness
                #LOC_BDArmory_AIWindow_EvasionErraticness_Context = Unberechenbarkeit bei Ausweichen (Nichtlinearität)
                #LOC_BDArmory_AIWindow_EvasionRCS = #LOC_BDArmory_AI_EvasionRCS
                #LOC_BDArmory_AIWindow_EvasionRCS_Context = RKS zum Ausweichen von gegnerischem Feuer verwenden
                #LOC_BDArmory_AIWindow_EvasionEngines = #LOC_BDArmory_AI_EvasionEngines
